name: Build Kernel with KernelSU Next

on:
  workflow_dispatch:
  push:
    branches: [kernelsu-integration]

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    container: ubuntu:22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: kernelsu-integration
          path: kernel-source

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush \
            rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python3 python3-pip python-is-python3 wget tar
          pip3 install pycrypto

      - name: Clone KernelSU Next
        run: |
          cd kernel-source
          git clone https://github.com/KernelSU-Next/KernelSU-Next.git --depth=1 -b stable KernelSU

      - name: Setup KernelSU Next Toolchains (GCC 4.9 + Clang)
        run: |
          cd kernel-source
          git clone https://github.com/KernelSU-Next/toolchains.git --depth=1 toolchains

          export KSU_TC=$PWD/toolchains
          export ARM64_GCC=$KSU_TC/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin
          export ARM32_GCC=$KSU_TC/gcc/linux-x86/arm/arm-linux-gnueabi-4.9/bin
          export CLANG_BIN=$KSU_TC/clang/bin

          echo "PATH=$CLANG_BIN:$ARM64_GCC:$ARM32_GCC:\$PATH" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-android-" >> $GITHUB_ENV
          echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "SUBARCH=arm64" >> $GITHUB_ENV

      - name: Build Kernel (Rosy 4.9)
        run: |
          cd kernel-source
          export PATH=$PATH

          make ARCH=arm64 rosy_perf_defconfig
          make ARCH=arm64 olddefconfig

          make -j$(nproc --all) \
            ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=${CROSS_COMPILE} \
            CROSS_COMPILE_ARM32=${CROSS_COMPILE_ARM32} \
            Image.gz-dtb

      - name: Build KernelSU Next Module
        run: |
          cd kernel-source/KernelSU/kernel
          export PATH=$PATH

          make -j$(nproc --all) \
            ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=${CROSS_COMPILE} \
            CROSS_COMPILE_ARM32=${CROSS_COMPILE_ARM32}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ksu-next-build-${{ github.run_number }}
          path: |
            kernel-source/arch/arm64/boot/Image.gz-dtb
            kernel-source/KernelSU/kernel/kernel_su.ko
