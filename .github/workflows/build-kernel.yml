name: Redmi 5 Kernel 4.9 + KernelSU-Next

on:
  workflow_dispatch:
  push:
    branches: [kernelsu-integration]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison build-essential flex git \
          libssl-dev libncurses-dev \
          gcc-arm-linux-gnueabi

    - name: Fetch Proton Clang 11
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git $HOME/proton-clang

    - name: Integrate KernelSU-Next
      run: |
        curl -LSs https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh | bash -
        test -d KernelSU || exit 1

    - name: Setup environment
      run: |
        echo "ARCH=arm" >> $GITHUB_ENV
        echo "SUBARCH=arm" >> $GITHUB_ENV
        echo "OUT_DIR=out" >> $GITHUB_ENV
        echo "PATH=$HOME/proton-clang/bin:$PATH" >> $GITHUB_ENV

    - name: Configure kernel
      run: |
        make O=$OUT_DIR msm8937_defconfig

    - name: Enable KernelSU
      run: |
        scripts/config --file out/.config \
          --enable CONFIG_KERNELSU \
          --enable CONFIG_KPROBES \
          --enable CONFIG_HAVE_KPROBES \
          --enable CONFIG_MODULES \
          --enable CONFIG_SYSFS \
          --enable CONFIG_SECURITY_SELINUX
        make O=out olddefconfig

    - name: Build kernel
      run: |
        make -j$(nproc) O=$OUT_DIR \
          ARCH=arm \
          CC=clang \
          CLANG_TRIPLE=arm-linux-gnueabi- \
          CROSS_COMPILE=arm-linux-gnueabi-

    - name: Package artifacts
      run: |
        mkdir -p artifacts
        cp out/arch/arm/boot/zImage artifacts/ || true
        cp out/arch/arm/boot/Image.gz-dtb artifacts/ || true
        cp out/.config artifacts/config

    - name: Upload kernel
      uses: actions/upload-artifact@v4
      with:
        name: rosy-kernel-ksu
        path: artifacts
