name: Build Kernel with KernelSU Next

on:
  workflow_dispatch:
  push:
    branches: [kernelsu-integration]

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    container: ubuntu:22.04

    steps:
      - name: Free disk space
        run: |
            df -h
            rm -rf /usr/share/dotnet
            rm -rf /opt/ghc
            rm -rf /usr/local/lib/android
            rm -rf /usr/local/.ghcup
            apt-get clean
            df -h
          
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: kernelsu-integration
          path: kernel-source

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush \
            rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python3 python3-pip python-is-python3 wget tar clang
          pip3 install pycrypto

      - name: Clone KernelSU Next
        run: |
          cd kernel-source
          git clone https://github.com/KernelSU-Next/KernelSU-Next.git --depth=1 -b stable KernelSU

      - name: Setup Google Toolchains (GCC 4.9)
        run: |
          mkdir -p /opt/prebuilts
          cd /opt/prebuilts
  
          # Clone ARM64 toolchain
          git clone https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 --depth=1
  
          # Clone ARM32 toolchain
          git clone https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 --depth=1
  
          # Store absolute paths in environment variables
          echo "GCC_ARM64_PATH=/opt/prebuilts/aarch64-linux-android-4.9/bin" >> $GITHUB_ENV
          echo "GCC_ARM32_PATH=/opt/prebuilts/arm-linux-androideabi-4.9/bin" >> $GITHUB_ENV
            
      - name: Setup AOSP Clang
        run: |
          mkdir -p /opt/clang-prebuilts
          cd /opt/clang-prebuilts
      
          git clone --depth=1 --filter=blob:none --sparse https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 .

          git sparse-checkout set clang-r510928

          echo "CLANG_PATH=/opt/clang-prebuilts/clang-r510928/bin" >> $GITHUB_ENV
      
      - name: Verify all toolchains
        run: |
          echo "=== Current PATH ==="
          echo $PATH
          echo ""
          echo "=== Environment Variables ==="
          echo "GCC_ARM64_PATH: $GCC_ARM64_PATH"
          echo "GCC_ARM32_PATH: $GCC_ARM32_PATH"
          echo "CLANG_PATH: $CLANG_PATH"
          echo ""
          echo "=== Checking toolchain executables ==="
          ls -la $GCC_ARM64_PATH/aarch64-linux-android-gcc || echo "ARM64 GCC not found at $GCC_ARM64_PATH"
          ls -la $GCC_ARM32_PATH/arm-linux-androideabi-gcc || echo "ARM32 GCC not found at $GCC_ARM32_PATH"
          ls -la $CLANG_PATH/clang || echo "Clang not found at $CLANG_PATH"
          
      - name: Build Kernel (Rosy 4.9) - ARM64
        run: |
          cd kernel-source
          
          # Set up PATH with all toolchains (CRITICAL FIX)
          export PATH=$CLANG_PATH:$GCC_ARM64_PATH:$GCC_ARM32_PATH:$PATH
          
          # Set all environment variables explicitly
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export CC=clang
          
          echo "=== Final PATH in build step ==="
          echo $PATH
          echo ""
          echo "=== Checking executables ==="
          which clang
          which aarch64-linux-android-gcc
          which arm-linux-androideabi-gcc
          echo ""
          echo "=== Versions ==="
          clang --version | head -5
          aarch64-linux-android-gcc --version | head -5
          
          # Build kernel
          make msm8937-perf_defconfig
          make olddefconfig
          make -j$(nproc --all) Image.gz-dtb

      - name: Build KernelSU Next Module
        run: |
          cd kernel-source/KernelSU/kernel
          
          # Set up PATH again (each step is isolated)
          export PATH=$CLANG_PATH:$GCC_ARM64_PATH:$GCC_ARM32_PATH:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export CC=clang
          
          make -j$(nproc --all)

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ksu-next-build-${{ github.run_number }}
          path: |
            kernel-source/arch/arm64/boot/Image.gz-dtb
            kernel-source/KernelSU/kernel/kernel_su.ko
