name: Redmi 5 ARM64 Kernel 4.9 + KernelSU-Next

on:
  workflow_dispatch:
  push:
    branches: [kernelsu-integration]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison build-essential flex git \
          libssl-dev libncurses-dev \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

    - name: Fetch Proton Clang 11
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git $HOME/proton-clang

    - name: Manual KernelSU-Next Integration
      run: |
        git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next.git -b next ksu-next

        # Copy driver
        cp -r ksu-next/kernel/KernelSU drivers/

        # Inject Makefile
        echo 'obj-$(CONFIG_KERNELSU) += KernelSU/' >> drivers/Makefile

        # Inject Kconfig
        sed -i '/menu "Device Drivers"/a source "drivers/KernelSU/Kconfig"' drivers/Kconfig

    - name: Setup environment
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "OUT_DIR=out" >> $GITHUB_ENV
        echo "PATH=$HOME/proton-clang/bin:$PATH" >> $GITHUB_ENV

    - name: Configure kernel
      run: |
        make O=$OUT_DIR rosy_defconfig

    - name: Enable KernelSU
      run: |
        scripts/config --file out/.config \
          --enable CONFIG_KERNELSU \
          --enable CONFIG_KPROBES \
          --enable CONFIG_HAVE_KPROBES \
          --enable CONFIG_MODULES \
          --enable CONFIG_SYSFS \
          --enable CONFIG_SECURITY_SELINUX
        make O=out olddefconfig

    - name: Build kernel
      run: |
        make -j$(nproc) O=$OUT_DIR \
          ARCH=arm64 \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi-

    - name: Package artifacts
      run: |
        mkdir -p artifacts
        cp out/arch/arm64/boot/Image.gz-dtb artifacts/ || true
        cp out/.config artifacts/config

    - name: Upload kernel
      uses: actions/upload-artifact@v4
      with:
        name: rosy-kernel-ksu-arm64
        path: artifacts
