name: Build Redmi 5 Kernel with KSU

on:
  workflow_dispatch:
  push:
    branches: [kernelsu-integration]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Make build script executable
      run: |
        chmod +x build_scripts/build_4.9.sh

    - name: Run kernel build script + KernelSU-Next
      run: |
        # Integrate KernelSU-Next first
        curl -LSs https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh \
          | bash -

        # Run the distro’s build helper
        ./build_scripts/build_4.9.sh
      env:
        OUT_DIR: out
        ARCH: arm

    - name: Collect kernel build artifacts
      run: |
        mkdir -p artifacts
        cp out/arch/arm/boot/zImage artifacts/ || true
        cp out/arch/arm/boot/Image.gz-dtb artifacts/ || true
        cp out/.config artifacts/kernel_config || true

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: rosy-kernel-ksu
        path: artifacts
