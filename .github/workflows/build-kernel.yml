name: Build Kernel with KernelSU Next

on:
  workflow_dispatch:
  push:
    branches: [kernelsu-integration]

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    container: ubuntu:22.04

    # Set environment variables at job level so they're available to all steps
    env:
      ARCH: arm64
      SUBARCH: arm64
      CROSS_COMPILE: aarch64-linux-android-
      CROSS_COMPILE_ARM32: arm-linux-androideabi-
      CC: clang

    steps:
      - name: Free disk space
        run: |
            df -h
            rm -rf /usr/share/dotnet
            rm -rf /opt/ghc
            rm -rf /usr/local/lib/android
            rm -rf /usr/local/.ghcup
            apt-get clean
            df -h
          
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: kernelsu-integration
          path: kernel-source

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush \
            rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python3 python3-pip python-is-python3 wget tar clang
          pip3 install pycrypto

      - name: Clone KernelSU Next
        run: |
          cd kernel-source
          git clone https://github.com/KernelSU-Next/KernelSU-Next.git --depth=1 -b stable KernelSU

      - name: Setup Google Toolchains (GCC 4.9)
        run: |
          mkdir -p prebuilts
          cd prebuilts
  
          # Clone ARM64 toolchain
          git clone https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 --depth=1
  
          # Clone ARM32 toolchain
          git clone https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 --depth=1
  
          # Add toolchains to PATH
          echo "$PWD/aarch64-linux-android-4.9/bin" >> $GITHUB_PATH
          echo "$PWD/arm-linux-androideabi-4.9/bin" >> $GITHUB_PATH
            
      - name: Setup AOSP Clang (official prebuilts)
        run: |
          cd kernel-source
          mkdir -p clang-prebuilts
      
          git clone --depth=1 --filter=blob:none --sparse https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 clang-prebuilts

          cd clang-prebuilts
          git sparse-checkout set clang-r510928

          echo "$PWD/clang-r510928/bin" >> $GITHUB_PATH
          echo "CLANG_PATH=$PWD/clang-r510928/bin" >> $GITHUB_ENV
      
      - name: Verify toolchains
        run: |
          echo "=== PATH ==="
          echo $PATH
          echo ""
          echo "=== Toolchain verification ==="
          which aarch64-linux-android-gcc || echo "ARM64 GCC not found"
          which arm-linux-androideabi-gcc || echo "ARM32 GCC not found"
          which clang || echo "Clang not found"
          echo ""
          echo "=== Environment variables ==="
          echo "ARCH=$ARCH"
          echo "CC=$CC"
          echo "CROSS_COMPILE=$CROSS_COMPILE"
          
      - name: Build Kernel (Rosy 4.9) - ARM64
        run: |
          cd kernel-source
          
          # Export all needed variables
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export CC=clang
          
          # Check if clang is available
          which clang
          clang --version
          
          # Build
          make msm8937-perf_defconfig
          make olddefconfig
          make -j$(nproc --all) Image.gz-dtb

      - name: Build KernelSU Next Module
        run: |
          cd kernel-source/KernelSU/kernel
          
          # Export variables again (each step has isolated environment)
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export CC=clang
          
          make -j$(nproc --all)

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ksu-next-build-${{ github.run_number }}
          path: |
            kernel-source/arch/arm64/boot/Image.gz-dtb
            kernel-source/KernelSU/kernel/kernel_su.ko
