name: Build Redmi 5 Kernel with KernelSU-Next

on:
  workflow_dispatch:
  push:
    branches: [kernelsu-integration]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          bc build-essential git \
          clang llvm lld \
          libssl-dev libncurses-dev \
          gcc-arm-linux-gnueabi

    - name: Integrate KernelSU-Next
      run: |
        curl -LSs https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh | bash -

    - name: Setup Environment
      run: |
        echo "ARCH=arm" >> $GITHUB_ENV
        echo "SUBARCH=arm" >> $GITHUB_ENV
        echo "LLVM=1" >> $GITHUB_ENV
        echo "CROSS_COMPILE=arm-linux-gnueabi-" >> $GITHUB_ENV
        echo "OUT_DIR=out" >> $GITHUB_ENV

    - name: Configure Kernel
      run: |
        make O=$OUT_DIR msm8937_defconfig

    - name: Build Kernel
      run: |
        make -j$(nproc) O=$OUT_DIR

    - name: Prepare Artifacts
      run: |
        mkdir -p artifacts
        cp $OUT_DIR/arch/arm/boot/zImage artifacts/ || true
        cp $OUT_DIR/arch/arm/boot/Image.gz-dtb artifacts/ || true
        cp $OUT_DIR/.config artifacts/kernel_config || true

    - name: Upload Kernel Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: rosy-kernel-ksu
        path: artifacts
