name: Build Kernel with KernelSU Next

on:
  workflow_dispatch:
  push:
    branches: [kernelsu-integration]

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    container: ubuntu:22.04

    steps:
      - name: Free disk space
        run: |
            df -h
            rm -rf /usr/share/dotnet
            rm -rf /opt/ghc
            rm -rf /usr/local/lib/android
            rm -rf /usr/local/.ghcup
            apt-get clean
            df -h
          
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: kernelsu-integration
          path: kernel-source

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush \
            rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python3 python3-pip python-is-python3 wget tar \
            clang llvm lld gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          pip3 install pycrypto

      - name: Clone KernelSU Next
        run: |
          cd kernel-source
          git clone https://github.com/KernelSU-Next/KernelSU-Next.git --depth=1 -b stable KernelSU

      - name: Download Android NDK (includes Clang and GCC)
        run: |
          mkdir -p /opt/android-ndk
          cd /opt/android-ndk
          
          # Download Android NDK r25b (includes Clang and GCC toolchains)
          wget https://dl.google.com/android/repository/android-ndk-r25b-linux.zip
          unzip android-ndk-r25b-linux.zip
          
          # Set environment variables
          echo "NDK_PATH=/opt/android-ndk/android-ndk-r25b" >> $GITHUB_ENV
          echo "CLANG_PATH=/opt/android-ndk/android-ndk-r25b/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_ENV
          echo "GCC_ARM64_PATH=/opt/android-ndk/android-ndk-r25b/toolchains/aarch64-linux-android-4.9/prebuilt/linux-x86_64/bin" >> $GITHUB_ENV
          echo "GCC_ARM32_PATH=/opt/android-ndk/android-ndk-r25b/toolchains/arm-linux-androideabi-4.9/prebuilt/linux-x86_64/bin" >> $GITHUB_ENV
          
      - name: Verify all toolchains
        run: |
          echo "=== Android NDK toolchains ==="
          ls -la $CLANG_PATH/clang* | head -5
          ls -la $GCC_ARM64_PATH/aarch64-linux-android-gcc* | head -5
          ls -la $GCC_ARM32_PATH/arm-linux-androideabi-gcc* | head -5
          
          echo ""
          echo "=== Ubuntu cross compilers ==="
          which aarch64-linux-gnu-gcc
          which arm-linux-gnueabi-gcc
          which clang
          
      - name: Build Kernel (Rosy 4.9) - ARM64
        run: |
          cd kernel-source
          
          # OPTION 1: Use Android NDK toolchains (recommended for Android kernels)
          export PATH=$CLANG_PATH:$GCC_ARM64_PATH:$GCC_ARM32_PATH:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export CC=clang
          
          # OPTION 2: Use Ubuntu cross compilers (if NDK doesn't work)
          # export ARCH=arm64
          # export SUBARCH=arm64
          # export CROSS_COMPILE=aarch64-linux-gnu-
          # export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          # export CC=clang
          
          echo "=== Toolchain verification ==="
          which clang
          which aarch64-linux-android-gcc || which aarch64-linux-gnu-gcc
          clang --version | head -3
          
          echo ""
          echo "=== Starting kernel build ==="
          make msm8937-perf_defconfig
          make olddefconfig
          make -j$(nproc --all) Image.gz-dtb

      - name: Build KernelSU Next Module
        run: |
          cd kernel-source/KernelSU/kernel
          
          # Use same toolchain as kernel build
          export PATH=$CLANG_PATH:$GCC_ARM64_PATH:$GCC_ARM32_PATH:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export CC=clang
          
          make -j$(nproc --all)

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ksu-next-build-${{ github.run_number }}
          path: |
            kernel-source/arch/arm64/boot/Image.gz-dtb
            kernel-source/KernelSU/kernel/kernel_su.ko
